services:
  app:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - app-venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "uv sync --frozen --no-dev && uv run fastapi dev --host 0.0.0.0 --port 8000 /app/app/main.py"
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - worker-venv:/app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "uv sync --frozen --no-dev && uv run celery -A app.core.celery_app worker --loglevel=info"
    depends_on:
      - redis
      - app

volumes:
  app-venv:
  worker-venv:
